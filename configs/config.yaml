ollama:
  base_url: "http://localhost:11434"
  model: "qwen3:14b"
  temperature: 0.0
  timeout_seconds: 120
  num_ctx: 8192         # context window sent as options.num_ctx
  seed: 42
  think: false          # disable reasoning traces (requires Ollama >= 0.9)
  evidence_mode: "web"             # web | evidence_only

retrieval:
  top_k: 5
  candidate_k: 40        # passages taken (in search-rank order) before reranking
  reranker_model: "BAAI/bge-reranker-v2-m3"   # null disables reranking
  device: "cuda"         # used by the reranker ("cpu" default value)
  min_relevance: 0.2     # drop passages scoring below this
  max_passages_per_source: 2   # per publisher domain
  max_passage_chars: 800
  query_generation: true
  max_search_requests: 8       # (query, site-group) requests per claim
  max_pages_per_claim: 8
  cache_dir: "cache"
  cache_mode: "read_write"     # read_write | read_only | off
  cache_max_age_days: null     # null = entries never expire

search:
  backend: "searxng"           # searxng | ollama (Ollama hosted web search)
  page_fetcher: "direct"       # direct | ollama (Ollama hosted web fetch)
  ollama_web_url: "https://ollama.com"
  # The Ollama API key is never stored here: set SEARCH_OLLAMA_API_KEY (or OLLAMA_API_KEY)
  base_url: "http://localhost:8080"
  timeout_seconds: 20
  min_interval_seconds: 210     # ~1 search per 3.5 min: Brave refills ~1 search per 3 min (measured 2026-09-27)
  results_per_query: 10
  site_filter: "grouped"       # grouped | per_domain | none (strict mode only); none = plain queries + policy post-filter
  site_group_size: 10
  fetch_timeout_seconds: 10
  max_page_bytes: 2000000
  user_agent: "DisinfoDetection-Research/1.0"
  respect_robots: true

source_policy:
  path: "configs/source_policy.yaml"
  mode: "strict"               # strict | lenient | off
  unknown_trust: 0.3

preprocessing:
  supported_languages:
    - "en"
    - "uk"
    - "ru"
    - "zh"
  spacy_models:
    en: "en_core_web_sm"
    uk: "uk_core_news_sm"
    ru: "ru_core_news_sm"
    zh: "zh_core_web_sm"

claim_extraction:
  min_claim_length: 10
  max_claim_length: 512
  checkworthy_threshold: 0.1   # tuned with the "news"/"opinion" zero-shot labels
  classifier_model: "MoritzLaurer/mDeBERTa-v3-base-xnli-multilingual-nli-2mil7"
  ner_weight: 0.3
  classifier_weight: 0.7

verification:
  nli_model: "MoritzLaurer/mDeBERTa-v3-base-xnli-multilingual-nli-2mil7"
  nli_weight: 0.3
  rag_weight: 0.7
  thresholds:
    disinformation: 0.35
    confirmed: 0.65
  decisiveness_margin: 0.15
  require_llm_decision: true   # UNCERTAIN unless the LLM is decisive; false = NLI may decide alone (ablation)
  llm_override_confidence: 0.8  # in a conflict, an LLM this confident overrides NLI; null disables, 0.9 = stricter
  nli_ignore_support_tiers:    # NLI support from these tiers is ignored: debunks quote the claim they refute
    - fact_checkers

logging:
  level: "INFO"
  log_file: "logs/app.log"
  max_bytes: 10485760   # 10 MB
  backup_count: 5
